[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-assistant-service"
version = "0.1.0"
description = "Local Python service for MT5 Assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "jsonschema>=4.23,<5", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["mt5_assistant*"]
